<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilderness EM Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --card: #1e293b; --card2: #263348;
      --accent: #14b8a6; --accent2: #0ea5e9;
      --correct: #22c55e; --wrong: #ef4444; --warn: #f59e0b;

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg, #0f172a 0%, #1a2744 100%); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p  { font-size: 0.8rem; color: var(--sub); }

    #home { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .home-intro { text-align: center; margin-bottom: 2.5rem; }
    .home-intro h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .home-intro p  { color: var(--sub); font-size: 1rem; }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
    .quiz-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-color, var(--accent)); }
    .quiz-card:hover { transform: translateY(-3px); border-color: var(--accent-color, var(--accent)); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .quiz-card .card-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .quiz-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
    .quiz-card p  { font-size: 0.85rem; color: var(--sub); line-height: 1.5; }
    .quiz-card .card-meta { margin-top: 1rem; display: flex; gap: 0.75rem; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--sub); font-weight: 600; }
    .badge.done { background: rgba(34,197,94,.15); color: var(--correct); }
    #quiz { display: none; padding: 1.5rem; max-width: 800px; margin: 0 auto; }
    .quiz-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .btn-back { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: background .15s; }
    .btn-back:hover { background: var(--card2); }
    .progress-bar-wrap { flex: 1; background: var(--card); border-radius: 999px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .4s ease; }
    .q-counter { font-size: 0.85rem; color: var(--sub); white-space: nowrap; }
    .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .q-img-wrap { width: 100%; height: 280px; background: #111827; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .q-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .img-fallback { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--sub); font-size: 0.9rem; text-align: center; padding: 1rem; }
    .img-fallback .fb-icon { font-size: 4rem; }
    .img-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding: 2rem 1rem 0.75rem; font-size: 0.75rem; color: rgba(255,255,255,.6); font-style: italic; }
    .q-body { padding: 1.5rem; }
    .q-scenario { font-size: 0.78rem; color: var(--warn); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 0.5rem; }
    .q-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .choices { display: flex; flex-direction: column; gap: 0.75rem; }
    .choice-btn { background: var(--card2); border: 1.5px solid var(--border); color: var(--text); padding: 0.85rem 1.1rem; border-radius: 10px; cursor: pointer; text-align: left; font-size: 0.9rem; line-height: 1.4; transition: all .15s; display: flex; gap: 0.75rem; align-items: flex-start; }
    .choice-btn .opt-letter { width: 24px; height: 24px; min-width: 24px; border-radius: 50%; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .choice-btn:not(.locked):hover { border-color: var(--accent); background: rgba(20,184,166,.1); }
    .choice-btn.correct { border-color: var(--correct); background: rgba(34,197,94,.12); }
    .choice-btn.correct .opt-letter { background: var(--correct); color: #000; }
    .choice-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,.12); }
    .choice-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }
    .choice-btn.locked { cursor: default; }
    .explanation { margin-top: 1.25rem; background: rgba(14,165,233,.08); border: 1px solid rgba(14,165,233,.25); border-radius: 10px; padding: 1rem 1.25rem; font-size: 0.88rem; line-height: 1.6; color: #cbd5e1; }
    .explanation strong { color: var(--accent2); }
    .explanation em { color: #e2e8f0; font-style: italic; }
    .explanation.correct-exp { border-color: rgba(34,197,94,.3); background: rgba(34,197,94,.06); }
    .explanation.wrong-exp   { border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.06); }
    .exp-source { margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,.08); font-size: 0.75rem; color: var(--sub); font-style: italic; line-height: 1.5; }
    .btn-next { margin-top: 1.25rem; width: 100%; padding: 0.9rem; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-next:hover { opacity: .88; }
    #results { display: none; padding: 2rem; max-width: 720px; margin: 0 auto; }
    .results-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; text-align: center; }
    .score-ring { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid var(--accent); background: rgba(20,184,166,.08); }
    .score-ring .score-num { font-size: 2.5rem; font-weight: 800; }
    .score-ring .score-den { font-size: 0.9rem; color: var(--sub); }
    .score-label { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .score-sub   { color: var(--sub); margin-bottom: 2rem; font-size: 0.9rem; }
    .review-list { text-align: left; margin-top: 1.5rem; }
    .review-item { border-radius: 10px; border: 1px solid var(--border); padding: 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; }
    .review-item.r-correct { border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.05); }
    .review-item.r-wrong   { border-color: rgba(239,68,68,.4);  background: rgba(239,68,68,.05); }
    .review-item .r-q { margin-bottom: 0.4rem; color: #cbd5e1; }
    .review-item .r-ans { font-weight: 600; }
    .review-item .r-ans.correct { color: var(--correct); }
    .review-item .r-ans.wrong   { color: var(--wrong); }
    .results-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    .btn-outline { padding: 0.7rem 1.5rem; border: 1.5px solid var(--border); background: transparent; color: var(--text); border-radius: 10px; cursor: pointer; font-size: 0.9rem; transition: all .15s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { padding: 0.7rem 1.5rem; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 700; transition: opacity .15s; }
    .btn-primary:hover { opacity: .88; }
    @media (max-width: 600px) { #home, #quiz { padding: 1rem; } .q-img-wrap { height: 200px; } }
  </style>

<body>

<header>
  <div class="logo">🏕️</div>
  <div>
    <h1>Wilderness EM Quiz</h1>
    <p>Emergency Medicine Simulation — Toxicology &amp; Envenomations</p>
  </div>
</header>

<div id="home">
  <div class="home-intro">
    <h2>Choose a Quiz Module</h2>

  </div>
  <div class="quiz-grid" id="quizGrid"></div>
</div>

<div id="quiz">
  <div class="quiz-header">
    <button class="btn-back" onclick="goHome()">← Back</button>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

  </div>

    </div>
    <div class="score-label" id="scoreLabel">—</div>
    <div class="score-sub"  id="scoreSub">—</div>
    <div class="review-list" id="reviewList"></div>

      <button class="btn-primary" onclick="goHome()">All Modules →</button>
    </div>
  </div>
</div>

<script>
const QUIZZES = [

  // ══════════════════════════════════════════
  // QUIZ 1 — TOXIDROMES & POISONINGS
  // Level: PGY1–3 · Classic presentations · Core management
  // ══════════════════════════════════════════
  {
    id: 'toxidromes', title: 'Toxidromes & Poisonings', icon: '☠️', color: '#f43f5e',
    description: 'Recognize toxic syndromes and make the right first management decision',
    questions: [
      {
        img: 'https://images.pexels.com/photos/2286921/pexels-photo-2286921.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '🌾', imgLabel: 'Pesticide spraying on crops — organophosphates are common agricultural insecticides causing mass poisonings',
        scenario: 'Field stabilization — pesticide exposure',
        text: 'A farm worker is found collapsed in a pesticide shed. He is bradycardic (HR 42), has pinpoint pupils, copious secretions dripping from his mouth, audible wheeze, and has vomited twice. Which treatment is the most immediately life-saving?',
        choices: [
          'Pralidoxime (2-PAM) 1 g IV — reactivate acetylcholinesterase before it ages',
          'Atropine 2–4 mg IV, repeated until secretions dry and bronchospasm clears',
          'Activated charcoal via NG tube — prevent further GI absorption',
          'Diazepam 5 mg IV — prevent seizures from nicotinic overstimulation'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Atropine is the primary life-saving antidote — titrate to secretions, not heart rate</div>
Organophosphates inhibit acetylcholinesterase, causing excess acetylcholine at muscarinic receptors. The immediate threat is <strong>bronchospasm and bronchorrhea</strong>. Atropine blocks muscarinic receptors and must be given in large, repeated doses until secretions dry — not until heart rate normalizes. Pralidoxime (2-PAM) is important to co-administer to prevent irreversible enzyme "aging," but atropine saves lives first. The classic mnemonic for muscarinic symptoms is SLUDGE (Salivation, Lacrimation, Urination, Defecation, GI distress, Emesis) — though memorizing the antidote principle matters more than the acronym.
<div class="exp-source">Eddleston M, et al. Lancet. 2008;371(9612):597–607. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 113. WHO Acute Poisoning Management Guidelines, 2008.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/3683047/pexels-photo-3683047.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '💊', imgLabel: 'Transdermal fentanyl patch — continuous opioid delivery outlasts naloxone\'s 30–90 min duration',
        scenario: 'Wilderness rescue — re-sedation after naloxone',
        text: 'A hiker found unresponsive (RR 4, pinpoint pupils, fentanyl patch visible on chest) responds well to naloxone 0.4 mg IM — he wakes and is speaking. Forty minutes later he becomes unresponsive again. What is the best explanation?',
        choices: [
          'He co-ingested a second drug — obtain urine drug screen before re-dosing',
          'Naloxone (duration 30–90 min) wore off before fentanyl absorption from the patch ended; re-dose or give an infusion',
          'Naloxone causes rebound sedation with repeat exposure',
          'He has aspirated; airway management takes priority over repeat naloxone'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Naloxone is shorter-acting than most opioids — re-dosing is expected</div>
Naloxone has a half-life of approximately 60–90 minutes, which is <em>shorter</em> than fentanyl from a transdermal patch (which continues absorbing after removal). Re-sedation is the rule, not the exception. Treatment: <strong>repeat naloxone boluses</strong> or a naloxone infusion (two-thirds of the effective reversal dose per hour). Do not assume co-ingestion or aspiration until re-dosing has been tried. Always monitor patients for at least 4–6 hours after any opioid reversal.
<div class="exp-source">Boyer EW. N Engl J Med. 2012;367(2):146–155. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 38. Auerbach's Wilderness Medicine, 7th ed., Ch. 64.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Datura_stramonium_3.jpg?width=640',
        imgFallback: '🌸', imgLabel: 'Datura stramonium (jimsonweed) — source of anticholinergic alkaloids',
        scenario: 'Music festival — altered young patient',
        text: 'A 17-year-old is found wandering at an outdoor festival: HR 148, T 38.8°C, skin flushed and completely dry, pupils 9 mm, urinary retention, and mumbling about bugs on the wall. His friends say he was "eating flower seeds." Which toxidrome matches this presentation?',
        choices: [
          'Opioid toxidrome — pinpoint pupils and sedation are classic',
          'Anticholinergic toxidrome — dry/flushed skin, mydriasis, tachycardia, urinary retention, hallucinations',
          'Sympathomimetic toxidrome (cocaine/methamphetamine)',
          'Serotonin syndrome — fever, agitation, and hallucinations'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Anticholinergic toxidrome: "Hot as a hare, dry as a bone, red as a beet, blind as a bat, mad as a hatter"</div>
The classic anticholinergic picture combines <strong>tachycardia, hyperthermia, flushed dry skin, mydriasis, urinary retention, ileus, and delirium/hallucinations</strong>. Jimsonweed (Datura stramonium) seeds contain the tropane alkaloids atropine, scopolamine, and hyoscyamine. Opioids cause miosis (not mydriasis) and bradypnea. Sympathomimetics cause diaphoresis (sweat glands are cholinergic), distinguishing them from anticholinergics. Management: cooling, benzodiazepines for agitation; physostigmine can be used by experienced providers.
<div class="exp-source">Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 65. Tintinalli's Emergency Medicine, 9th ed., Ch. 184.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/593451/pexels-photo-593451.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '💊', imgLabel: 'Sertraline (SSRI) tablets — serotonergic drug interaction risk',
        scenario: 'ED transfer — fever and involuntary movements after new antibiotic',
        text: 'A 48-year-old on sertraline 100 mg daily is started on linezolid for MRSA cellulitis. Two days later she develops fever (38.9°C), agitation, diarrhea, and rhythmic involuntary jerking of both ankles when you dorsiflex her feet. What is the most likely diagnosis?',
        choices: [
          'Neuroleptic malignant syndrome — linezolid is a dopamine antagonist',
          'Serotonin syndrome — linezolid is a weak MAO inhibitor, causing serotonin excess with the SSRI',
          'Meningitis — lumbar puncture is the next step',
          'Antibiotic-associated colitis — diarrhea and fever are the clues'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Linezolid is a monoamine oxidase inhibitor — combining it with SSRIs causes serotonin syndrome</div>
Linezolid inhibits monoamine oxidase (MAO), increasing synaptic serotonin. Combined with any serotonergic drug (SSRIs, SNRIs, tramadol, fentanyl, triptans), it can precipitate <strong>serotonin syndrome</strong>. The key finding here is <em>clonus</em> — inducible or spontaneous rhythmic muscle jerking, especially at the ankles — which is the most specific feature distinguishing serotonin toxicity from NMS. Rapid onset (hours vs. days for NMS) also points to serotonin syndrome. Treatment: stop both drugs, benzodiazepines, cyproheptadine.
<div class="exp-source">Boyer EW, Shannon M. N Engl J Med. 2005;352(11):1112–1120. Dunkley EJC, et al. QJM. 2003;96(9):635–642.</div>`
      },
      {
        img: 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=800&q=80&fit=crop',
        imgFallback: '⛺', imgLabel: 'Tent camping — enclosed space CO poisoning risk',
        scenario: 'Winter camping — group found unconscious',
        text: 'Four campers are found unconscious in a sealed tent with a propane heater that ran all night. Your pulse oximeter reads 97–99% on all four victims. Why is this reading unreliable, and what should you do?',
        choices: [
          'Cold fingers cause falsely low readings — warm the extremities and recheck',
          'Pulse oximetry cannot distinguish carboxyhemoglobin from oxyhemoglobin — readings are falsely normal; treat empirically for CO poisoning',
          'A reading ≥97% rules out significant CO poisoning — look for another diagnosis',
          'Pulse ox is unreliable only in patients with dark skin pigmentation'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Standard pulse oximetry is blind to carbon monoxide — it reads SpO2 as falsely normal</div>
Carboxyhemoglobin (COHb) absorbs light at the same 660 nm wavelength as oxyhemoglobin. A standard two-wavelength pulse oximeter <em>cannot distinguish them</em>, so it reports deceptively normal saturations even in severe poisoning. Only <strong>co-oximetry</strong> (blood gas analyzer) or a specialized CO-oximeter measures true COHb. In any enclosed-space exposure, treat clinically: 100% O₂ via non-rebreather mask, rapid evacuation, consider hyperbaric oxygen for severe cases (coma, cardiac involvement, pregnancy).
<div class="exp-source">Hampson NB, et al. Ann Emerg Med. 2012;60(4):397–408. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 125.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/263402/pexels-photo-263402.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '🚑', imgLabel: 'Emergency medical response — sympathomimetic toxidrome causes severe agitation, hypertension, and hyperthermia',
        scenario: 'Outdoor concert — agitated combative patient',
        text: 'A 26-year-old is brought from a festival: HR 164, BP 198/116, T 38.5°C, diaphoretic, pupils dilated, extremely agitated and combative. Friends confirm stimulant use. Which is the most appropriate first treatment for his agitation and hemodynamic abnormalities?',
        choices: [
          'Haloperidol IM — standard antipsychotic for behavioral agitation',
          'Propranolol IV — lower the heart rate and blood pressure',
          'Lorazepam 2–4 mg IV — benzodiazepines treat the underlying sympathomimetic excess',
          'Physical restraints and observation while vital signs are monitored'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Benzodiazepines are first-line — they treat the toxidrome, not just the behavior</div>
In sympathomimetic toxidrome (cocaine, methamphetamine, MDMA), tachycardia, hypertension, and hyperthermia are all driven by excess catecholamine activity and CNS stimulation. <strong>Benzodiazepines</strong> reduce CNS excitation and secondarily normalize vitals. Haloperidol is inadequate alone and can lower seizure threshold; it also does not address the underlying physiology. <em>Propranolol is contraindicated</em> in cocaine toxicity — unopposed alpha stimulation can worsen hypertension. Physical restraints increase metabolic heat and worsen outcomes.
<div class="exp-source">Richards JR, et al. Ann Emerg Med. 2017;69(3):384–391. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 79.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/5699514/pexels-photo-5699514.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '💊', imgLabel: 'Acetaminophen (Tylenol) — most common cause of acute liver failure in the US',
        scenario: 'Intentional ingestion — "feels fine"',
        text: 'A 24-year-old took approximately 9 grams of acetaminophen 7 hours ago. She feels well — only mild nausea. Her serum APAP level is 165 mcg/mL, which plots above the treatment line on the Rumack-Matthew nomogram. Her ALT is 38 U/L (normal). Should N-acetylcysteine (NAC) be started?',
        choices: [
          'No — she is asymptomatic; observe and repeat LFTs in 12 hours',
          'No — NAC is only beneficial within 4 hours of ingestion',
          'Yes — the nomogram level is the indication; normal LFTs at 7 hours does not mean no risk',
          'Yes — but wait for the 12-hour APAP level to confirm the trend first'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Normal LFTs at 7 hours do NOT rule out hepatotoxicity — treat based on the nomogram</div>
Acetaminophen hepatotoxicity evolves in stages: toxicity peaks at 72–96 hours after ingestion. LFTs are often completely normal in the first 12–24 hours even in severe poisoning. The <strong>Rumack-Matthew nomogram</strong> uses the serum level at 4+ hours to predict risk — an above-line level at 7 hours clearly mandates NAC regardless of symptoms. NAC is most effective when started within 8 hours, but still significantly beneficial up to 24 hours and beyond. Never withhold it based on the patient "feeling fine."
<div class="exp-source">Rumack BH, Matthew H. Pediatrics. 1975;55(6):871–876. Acetaminophen Poisoning: AACT Position Statement. Clin Toxicol. 2014;52(9):956–967.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/12leadECG.jpg?width=640',
        imgFallback: '🫀', imgLabel: '12-lead ECG — wide QRS complex in TCA overdose',
        scenario: 'Overdose — wide-complex ECG and hypotension',
        text: 'A 32-year-old took her entire bottle of amitriptyline. She is lethargic, BP 84/52, HR 122. Her ECG shows a QRS of 140 ms with a tall R wave in lead aVR. What is the treatment of choice for the QRS widening and hemodynamic instability?',
        choices: [
          'Lidocaine 1 mg/kg IV — treat the ventricular dysrhythmia directly',
          'Sodium bicarbonate 1–2 mEq/kg IV bolus — alkalinization narrows QRS and raises BP',
          'Magnesium sulfate 2 g IV — stabilize cardiac membranes',
          'Flumazenil 0.2 mg IV — reverse the sedative component'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Sodium bicarbonate is the cornerstone of TCA toxicity — alkalinization plus sodium loading</div>
Tricyclic antidepressants cause toxicity via three mechanisms: fast sodium channel blockade (→ QRS widening), alpha-1 blockade (→ hypotension), and anticholinergic effects. <strong>Sodium bicarbonate</strong> works by: (1) alkalinizing the blood to pH 7.45–7.55, which reduces TCA binding to sodium channels, and (2) providing a sodium load to overcome the blocked channels. A QRS ≥100 ms or R wave in aVR ≥3 mm are indications to treat. <em>Flumazenil is contraindicated</em> — it can precipitate seizures in TCA overdose. Lidocaine is second-line only.
<div class="exp-source">Liebelt EL, et al. Ann Emerg Med. 1995;26(2):195–201. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 71.</div>`
      }
    ]
  },

  // ══════════════════════════════════════════

        scenario: 'Garden tea — bradycardia and yellow vision',
        text: 'An elderly woman brews tea from large leaves she finds in her garden (later confirmed to be Digitalis purpurea). She presents with bradycardia (HR 30), nausea, yellow-green visual disturbance, and serum potassium of 6.3 mEq/L. She takes no cardiac medications. What does the elevated potassium level indicate in this setting?',
        choices: [
          'She has underlying chronic kidney disease unrelated to the tea',
          'She is dehydrated from vomiting, causing a pre-renal shift in potassium',
          'Severe cardiac glycoside toxicity — Na/K-ATPase inhibition causes potassium to shift out of cells into serum',
          'She is also taking a potassium-sparing diuretic she didn\'t mention'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Hyperkalemia in cardiac glycoside toxicity indicates severe Na/K-ATPase inhibition — it is a marker, not the cause</div>
Na/K-ATPase normally pumps 3 Na⁺ out and 2 K⁺ into cells per cycle. When inhibited by cardiac glycosides, intracellular K⁺ can no longer be maintained — <strong>potassium shifts extracellularly</strong>, causing hyperkalemia. A K⁺ >5.5 mEq/L in acute digoxin (or plant glycoside) toxicity is a strong indicator of severe poisoning and is an independent indication for digoxin-specific Fab antibody fragments. Giving calcium gluconate is relatively contraindicated (risk of intracellular calcium overload). Treat with DigiFab; K⁺ will normalize as the toxin is bound. Do not treat the hyperkalemia with insulin/glucose first — address the underlying cause (the glycoside).
<div class="exp-source">Antman EM, et al. N Engl J Med. 1990;323(25):1717–1722. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 64.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Aconitum_napellus01.jpg?width=640',
        imgFallback: '💜', imgLabel: 'Aconitum napellus (monkshood/wolfsbane) — used in traditional herbal medicine; aconitine causes cardiac toxicity',
        scenario: 'Traditional herbal remedy — cardiac arrhythmia with paresthesias',
        text: 'A 44-year-old takes a traditional herbal preparation containing aconite root for arthritis. He develops immediate burning perioral numbness and tingling in his hands, then wide-complex ventricular tachycardia. Standard antiarrhythmic therapy has been ineffective. What is the key danger of aconitine poisoning?',
        choices: [
          'The perioral tingling indicates irreversible damage to cranial nerve V',
          'Hepatotoxicity from aconitine metabolism — liver failure develops within 24 hours',
          'Ventricular arrhythmias that are characteristically refractory to standard antiarrhythmic drugs',
          'It crosses the blood-brain barrier and causes irreversible seizures in most cases'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Aconitine-induced arrhythmias are notoriously treatment-resistant — have ECMO/cardioversion ready</div>
Aconitine activates voltage-gated sodium channels and prevents their inactivation, causing persistent depolarization of cardiac and neural tissue. Clinical hallmarks: <strong>immediate oral/lingual burning and numbness</strong> followed by cardiac arrhythmias — sinus bradycardia, supraventricular tachycardia, bidirectional ventricular tachycardia (similar to digoxin toxicity). The arrhythmias are frequently <em>refractory to amiodarone, lidocaine, and cardioversion</em>. There is no antidote. Treatment is supportive: benzodiazepines, antiarrhythmics empirically, and mechanical hemodynamic support (IABP or ECMO) in refractory cases. Perioral paresthesias are reversible. Aconitine preparations are used in traditional Chinese and Ayurvedic medicine — obtain a full supplement history in poisoned patients.
<div class="exp-source">Chan TY. Medicine (Baltimore). 2009;88(3):141–150. Auerbach's Wilderness Medicine, 7th ed., Ch. 63. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 117.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Phytolacca_americana.jpg?width=640',
        imgFallback: '🍇', imgLabel: 'Phytolacca americana (pokeweed) — dark purple berries; roots and leaves most toxic',
        scenario: 'Backyard — toddler ate pokeweed berries',
        text: 'A 2-year-old is brought in after eating an unknown number of pokeweed berries from a backyard plant. He is currently alert and asymptomatic. What is the expected clinical course and primary toxicity of pokeweed berry ingestion?',
        choices: [
          'Seizures — pokeweed has a potent convulsant alkaloid that acts rapidly',
          'Cardiac toxicity — similar to digoxin; prophylactic atropine and monitoring are indicated',
          'GI toxicity — nausea, vomiting, and diarrhea; serious systemic effects are uncommon with berry ingestion alone',
          'No toxicity — only the root and leaves are poisonous; the ripe berries are safe in small amounts'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Pokeweed berries cause GI toxicity — roots and leaves cause systemic illness; ripe berries vary in toxicity</div>
Pokeweed (<em>Phytolacca americana</em>) toxicity varies by plant part. The <strong>berries</strong> are the least toxic portion (though not truly safe), typically causing nausea, vomiting, and diarrhea when ingested in small amounts. The <strong>roots</strong> are the most toxic — they contain phytolaccatoxin and phytolaccigenin, which cause GI hemorrhage, severe hematologic effects, and rarely death. Green, unripe berries are more toxic than ripe dark berries. Systemic toxicity (bone marrow suppression, hemolysis) has been reported but is uncommon from berry ingestion alone. Management: activated charcoal if recent large ingestion, antiemetics, supportive care, and close monitoring. The plant also causes contact dermatitis.
<div class="exp-source">Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 117. Auerbach's Wilderness Medicine, 7th ed., Ch. 63. Roberge RJ, et al. Ann Emerg Med. 1986;15(4):470–473.</div>`
      }
    ]
  }

];

// ─── STATE ───────────────────────────────────
let state = { currentQuizIdx: null, currentQ: 0, answers: [], answered: false };
const scores = {};

function init() { renderHome(); }

function renderHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  const grid = document.getElementById('quizGrid');
  grid.innerHTML = QUIZZES.map((q, i) => {
    const done = scores[q.id];
    const pct  = done ? Math.round((done.score / done.total) * 100) : null;
    return `<div class="quiz-card" style="--accent-color:${q.color}" onclick="startQuiz(${i})">
      <div class="card-icon">${q.icon}</div>
      <h3>${q.title}</h3>
      <p>${q.description}</p>
      <div class="card-meta">
        <span class="badge">${q.questions.length} Questions</span>
        ${done ? `<span class="badge done">✓ ${pct}% (${done.score}/${done.total})</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function startQuiz(idx) {
  state.currentQuizIdx = idx;
  state.currentQ = 0;
  state.answers = [];
  state.answered = false;
  document.getElementById('home').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const quiz  = QUIZZES[state.currentQuizIdx];
  const q     = quiz.questions[state.currentQ];
  const total = quiz.questions.length;
  const idx   = state.currentQ;

  document.getElementById('progressBar').style.width = `${(idx / total) * 100}%`;
  document.getElementById('qCounter').textContent    = `${idx + 1} / ${total}`;

  document.getElementById('imgWrap').innerHTML = `
    <img src="${q.img}" alt="${q.imgLabel}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="img-fallback" style="display:none">
      <span class="fb-icon">${q.imgFallback}</span><span>${q.imgLabel}</span>
    </div>`;

  document.getElementById('qScenario').textContent = q.scenario;
  document.getElementById('qText').textContent     = q.text;

  const letters = ['A','B','C','D'];
  document.getElementById('choices').innerHTML = q.choices.map((c, i) =>
    `<button class="choice-btn" onclick="selectAnswer(${i})" id="choice${i}">
       <span class="opt-letter">${letters[i]}</span><span>${c}</span>
     </button>`).join('');

  const expEl = document.getElementById('explanation');
  expEl.style.display = 'none';
  expEl.innerHTML = '';
  const nextBtn = document.getElementById('btnNext');
  nextBtn.style.display = 'none';
  nextBtn.textContent = (idx === total - 1) ? 'See Results →' : 'Next Question →';
  state.answered = false;
}

function selectAnswer(chosen) {
  if (state.answered) return;
  state.answered = true;
  const quiz    = QUIZZES[state.currentQuizIdx];
  const q       = quiz.questions[state.currentQ];
  const correct = q.correct;
  const isRight = chosen === correct;
  state.answers.push({ chosen, correct, isRight });

  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === correct) btn.classList.add('correct');
    if (i === chosen && !isRight) btn.classList.add('wrong');
  });

  const expEl = document.getElementById('explanation');
  expEl.className = `explanation ${isRight ? 'correct-exp' : 'wrong-exp'}`;
  expEl.innerHTML = `<div style="font-weight:700;font-size:.9rem;margin-bottom:.4rem">${isRight ? '✓ Correct' : '✗ Incorrect'}</div>${q.explanation}`;
  expEl.style.display = 'block';
  document.getElementById('btnNext').style.display = 'block';
}

function nextQuestion() {
  const quiz = QUIZZES[state.currentQuizIdx];
  state.currentQ++;
  if (state.currentQ >= quiz.questions.length) showResults();
  else renderQuestion();
}

function showResults() {
  const quiz  = QUIZZES[state.currentQuizIdx];
  const score = state.answers.filter(a => a.isRight).length;
  const total = quiz.questions.length;
  const pct   = Math.round((score / total) * 100);
  scores[quiz.id] = { score, total };

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDen').textContent = `/ ${total}`;

  const color = pct >= 80 ? 'var(--correct)' : pct >= 60 ? 'var(--warn)' : 'var(--wrong)';
  const ring  = document.getElementById('scoreRing');
  ring.style.borderColor = color;
  ring.style.background  = `${color}18`;

  const [, label, sub] = [
    [90,'Excellent!','Outstanding — ready for the field.'],
    [75,'Well done!','Strong knowledge — review any missed items.'],
    [50,'Good effort','Review the explanations and retry.'],
    [0, 'Keep studying','Review the content and try again.']
  ].find(([min]) => pct >= min);
  document.getElementById('scoreLabel').textContent = `${pct}% — ${label}`;
  document.getElementById('scoreSub').textContent   = sub;

  const letters = ['A','B','C','D'];
  document.getElementById('reviewList').innerHTML = state.answers.map((a, i) => {
    const q = quiz.questions[i];
    return `<div class="review-item ${a.isRight ? 'r-correct' : 'r-wrong'}">
      <div class="r-q"><strong>Q${i+1}:</strong> ${q.text.substring(0,90)}${q.text.length>90?'…':''}</div>
      ${!a.isRight ? `<div class="r-ans wrong">Your answer: ${letters[a.chosen]}. ${q.choices[a.chosen]}</div>` : ''}
      <div class="r-ans correct">Correct: ${letters[a.correct]}. ${q.choices[a.correct]}</div>
    </div>`;
  }).join('');
}

function goHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  renderHome();
}
function retryQuiz() { startQuiz(state.currentQuizIdx); }

init();
</script>
