<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilderness EM Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --card: #1e293b; --card2: #263348;
      --accent: #14b8a6; --accent2: #0ea5e9;
      --correct: #22c55e; --wrong: #ef4444; --warn: #f59e0b;
      --text: #f1f5f9; --sub: #94a3b8; --border: #334155;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg, #0f172a 0%, #1a2744 100%); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p  { font-size: 0.8rem; color: var(--sub); }
    .logo { font-size: 2rem; }
    #home { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .home-intro { text-align: center; margin-bottom: 2.5rem; }
    .home-intro h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .home-intro p  { color: var(--sub); font-size: 1rem; }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
    .quiz-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-color, var(--accent)); }
    .quiz-card:hover { transform: translateY(-3px); border-color: var(--accent-color, var(--accent)); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .quiz-card .card-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .quiz-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
    .quiz-card p  { font-size: 0.85rem; color: var(--sub); line-height: 1.5; }
    .quiz-card .card-meta { margin-top: 1rem; display: flex; gap: 0.75rem; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--sub); font-weight: 600; }
    .badge.done { background: rgba(34,197,94,.15); color: var(--correct); }
    #quiz { display: none; padding: 1.5rem; max-width: 800px; margin: 0 auto; }
    .quiz-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .btn-back { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: background .15s; }
    .btn-back:hover { background: var(--card2); }
    .progress-bar-wrap { flex: 1; background: var(--card); border-radius: 999px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .4s ease; }
    .q-counter { font-size: 0.85rem; color: var(--sub); white-space: nowrap; }
    .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .q-img-wrap { width: 100%; height: 280px; background: #111827; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .q-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .img-fallback { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--sub); font-size: 0.9rem; text-align: center; padding: 1rem; }
    .img-fallback .fb-icon { font-size: 4rem; }
    .img-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding: 2rem 1rem 0.75rem; font-size: 0.75rem; color: rgba(255,255,255,.6); font-style: italic; }
    .q-body { padding: 1.5rem; }
    .q-scenario { font-size: 0.78rem; color: var(--warn); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 0.5rem; }
    .q-text { font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .choices { display: flex; flex-direction: column; gap: 0.75rem; }
    .choice-btn { background: var(--card2); border: 1.5px solid var(--border); color: var(--text); padding: 0.85rem 1.1rem; border-radius: 10px; cursor: pointer; text-align: left; font-size: 0.9rem; line-height: 1.4; transition: all .15s; display: flex; gap: 0.75rem; align-items: flex-start; }
    .choice-btn .opt-letter { width: 24px; height: 24px; min-width: 24px; border-radius: 50%; background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .choice-btn:not(.locked):hover { border-color: var(--accent); background: rgba(20,184,166,.1); }
    .choice-btn.correct { border-color: var(--correct); background: rgba(34,197,94,.12); }
    .choice-btn.correct .opt-letter { background: var(--correct); color: #000; }
    .choice-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,.12); }
    .choice-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }
    .choice-btn.locked { cursor: default; }
    .explanation { margin-top: 1.25rem; background: rgba(14,165,233,.08); border: 1px solid rgba(14,165,233,.25); border-radius: 10px; padding: 1rem 1.25rem; font-size: 0.88rem; line-height: 1.6; color: #cbd5e1; }
    .explanation strong { color: var(--accent2); }
    .explanation em { color: #e2e8f0; font-style: italic; }
    .explanation.correct-exp { border-color: rgba(34,197,94,.3); background: rgba(34,197,94,.06); }
    .explanation.wrong-exp   { border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.06); }
    .exp-source { margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,.08); font-size: 0.75rem; color: var(--sub); font-style: italic; line-height: 1.5; }
    .btn-next { margin-top: 1.25rem; width: 100%; padding: 0.9rem; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-next:hover { opacity: .88; }
    #results { display: none; padding: 2rem; max-width: 720px; margin: 0 auto; }
    .results-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; text-align: center; }
    .score-ring { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid var(--accent); background: rgba(20,184,166,.08); }
    .score-ring .score-num { font-size: 2.5rem; font-weight: 800; }
    .score-ring .score-den { font-size: 0.9rem; color: var(--sub); }
    .score-label { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .score-sub   { color: var(--sub); margin-bottom: 2rem; font-size: 0.9rem; }
    .review-list { text-align: left; margin-top: 1.5rem; }
    .review-item { border-radius: 10px; border: 1px solid var(--border); padding: 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; }
    .review-item.r-correct { border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.05); }
    .review-item.r-wrong   { border-color: rgba(239,68,68,.4);  background: rgba(239,68,68,.05); }
    .review-item .r-q { margin-bottom: 0.4rem; color: #cbd5e1; }
    .review-item .r-ans { font-weight: 600; }
    .review-item .r-ans.correct { color: var(--correct); }
    .review-item .r-ans.wrong   { color: var(--wrong); }
    .results-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    .btn-outline { padding: 0.7rem 1.5rem; border: 1.5px solid var(--border); background: transparent; color: var(--text); border-radius: 10px; cursor: pointer; font-size: 0.9rem; transition: all .15s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { padding: 0.7rem 1.5rem; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 700; transition: opacity .15s; }
    .btn-primary:hover { opacity: .88; }
    @media (max-width: 600px) { #home, #quiz { padding: 1rem; } .q-img-wrap { height: 200px; } }
  </style>
</head>
<body>

<header>
  <div class="logo">🏕️</div>
  <div>
    <h1>Wilderness EM Quiz</h1>
    <p>Emergency Medicine Simulation — Toxicology &amp; Envenomations</p>
  </div>
</header>

<div id="home">
  <div class="home-intro">
    <h2>Choose a Quiz Module</h2>
    <p>5 modules · 7 questions each · Q1–2 intern · Q3 PGY2 · Q4–5 PGY3 · Q6–7 attending</p>
  </div>
  <div class="quiz-grid" id="quizGrid"></div>
</div>

<div id="quiz">
  <div class="quiz-header">
    <button class="btn-back" onclick="goHome()">← Back</button>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <span class="q-counter" id="qCounter">1 / 8</span>
  </div>
  <div class="q-card">

    </div>

</div>

<div id="results">
  <div class="results-card">
    <div class="score-ring" id="scoreRing">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-den" id="scoreDen">/ 8</div>
    </div>
    <div class="score-label" id="scoreLabel">—</div>
    <div class="score-sub"  id="scoreSub">—</div>
    <div class="review-list" id="reviewList"></div>
    <div class="results-actions">
      <button class="btn-outline" onclick="retryQuiz()">↺ Retry Quiz</button>
      <button class="btn-primary" onclick="goHome()">All Modules →</button>
    </div>
  </div>
</div>

<script>
const QUIZZES = [

  // ══════════════════════════════════════════
  // QUIZ 1 — TOXIDROMES & POISONINGS
  // Q1–2 intern · Q3 PGY2 · Q4–5 PGY3 · Q6–7 attending
  // ══════════════════════════════════════════
  {
    id: 'toxidromes', title: 'Toxidromes & Poisonings', icon: '☠️', color: '#f43f5e',
    description: 'Recognize toxic syndromes and make the right first management decision',
    questions: [
      {
        img: 'https://images.pexels.com/photos/2286921/pexels-photo-2286921.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '🌾', imgLabel: 'Pesticide spraying on crops — organophosphate agricultural exposure',
        scenario: 'Field stabilization — pesticide exposure',
        text: 'A farm worker is found collapsed near pesticide storage. He is bradycardic (HR 38), has pinpoint pupils, copious secretions dripping from his mouth, and audible wheeze. Which treatment is the most immediately life-saving?',
        choices: [
          'Pralidoxime (2-PAM) 1 g IV',
          'Atropine 2–4 mg IV',
          'Activated charcoal via NG tube',
          'Lorazepam 2 mg IV'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Atropine is the primary life-saving antidote — titrate to secretions, not heart rate</div>
Organophosphates inhibit acetylcholinesterase, causing muscarinic excess. The immediate kill is <strong>bronchospasm and bronchorrhea</strong>. Atropine blocks muscarinic receptors; doses must be large and repeated until secretions dry — not until the heart rate normalizes. Pralidoxime (2-PAM) reactivates the enzyme and is important to co-administer, but atropine controls the airway first. Charcoal is only useful if ingested recently; seizures are prevented with benzodiazepines, not atropine.
<div class="exp-source">Eddleston M, et al. Lancet. 2008;371(9612):597–607. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 113.</div>`
      },
      {
        img: 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=800&q=80&fit=crop',
        imgFallback: '⛺', imgLabel: 'Sealed tent with propane heater — carbon monoxide accumulation risk',
        scenario: 'Winter camping — group found unconscious in sealed tent',
        text: 'Four campers are found unconscious in a sealed tent where a propane heater ran all night. Your pulse oximeter reads 97–99% on all four. Your partner says their sats look fine. What is the most important thing to understand about this reading?',
        choices: [
          'A reading above 95% reliably rules out significant carbon monoxide poisoning',
          'Cold extremities cause falsely low pulse oximetry',
          'Pulse oximetry cannot distinguish carboxyhemoglobin from oxyhemoglobin',
          'The reading confirms oxygenation is adequate; look for another cause of unconsciousness'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Standard pulse oximetry is blind to carbon monoxide — sats are deceptively normal</div>
Carboxyhemoglobin (COHb) absorbs light at the same 660 nm wavelength as oxyhemoglobin. A two-wavelength pulse oximeter cannot tell them apart — it reports normal SpO₂ even with lethal CO levels. Only <strong>co-oximetry</strong> (ABG machine) or a dedicated CO-oximeter accurately measures COHb. Treat based on clinical picture: 100% O₂ via non-rebreather mask, immediate evacuation, and consider hyperbaric oxygen for severe cases (coma, cardiac involvement, pregnancy).
<div class="exp-source">Hampson NB, et al. Ann Emerg Med. 2012;60(4):397–408. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 125.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/263402/pexels-photo-263402.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '🚑', imgLabel: 'Emergency medical response at a large outdoor event',
        scenario: 'Music festival — agitated, hypertensive, diaphoretic patient',
        text: 'A 24-year-old is brought by EMS from a festival: HR 172, BP 204/118, T 39.1°C, extremely agitated and diaphoretic, pupils dilated. Friends confirm stimulant use. What is the most appropriate first treatment?',
        choices: [
          'Propranolol IV',
          'Benzodiazepines IV',
          'Labetalol IV',
          'Phentolamine IV'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Beta-blockade in sympathomimetic toxicity → unopposed alpha stimulation → paradoxical hypertension</div>
In sympathomimetic toxicity (cocaine, methamphetamine), catecholamines activate both alpha and beta receptors. Blocking only beta receptors leaves alpha-mediated vasoconstriction unopposed — BP can worsen dramatically. This is especially dangerous in cocaine toxicity, which also causes direct coronary vasospasm. <strong>Benzodiazepines</strong> are first-line: they reduce CNS excitation and secondarily normalize vitals. If additional BP control is needed, phentolamine (alpha blocker) or nitroprusside can be added.
<div class="exp-source">Richards JR, et al. Ann Emerg Med. 2017;69(3):384–391. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 79.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/593451/pexels-photo-593451.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '💊', imgLabel: 'SSRI tablets — serotonergic drugs involved in serotonin syndrome',
        scenario: 'Admitted patient — fever and involuntary movements after a new antibiotic',
        text: 'A 52-year-old on sertraline is admitted for MRSA cellulitis and started on linezolid. Two days later she has fever (39.2°C), agitation, and diarrhea. On exam, dorsiflexing her ankle causes it to beat rhythmically three times. A consultant calls it "antibiotic fever." What is the correct diagnosis and most important next step?',
        choices: [
          'Neuroleptic malignant syndrome',
          'Serotonin syndrome',
          'Sepsis from undertreated MRSA',
          'Antibiotic fever'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Linezolid is a monoamine oxidase inhibitor — adding it to an SSRI causes serotonin syndrome</div>
Linezolid inhibits MAO, increasing synaptic serotonin. Combined with any serotonergic drug (SSRIs, SNRIs, tramadol, fentanyl, triptans), it can precipitate serotonin syndrome. The pathognomonic finding is <strong>clonus</strong> — inducible or spontaneous rhythmic muscle jerking, especially at the ankles — distinguishing it from NMS (which has lead-pipe rigidity and develops over days). Rapid onset (hours vs. days for NMS) also points to serotonin toxicity. Stop both drugs. Benzodiazepines for agitation; cyproheptadine is a reasonable adjunct.
<div class="exp-source">Boyer EW, Shannon M. N Engl J Med. 2005;352(11):1112–1120. Dunkley EJC, et al. QJM. 2003;96(9):635–642.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/12leadECG.jpg?width=640',
        imgFallback: '🫀', imgLabel: '12-lead ECG — wide QRS in tricyclic antidepressant overdose',
        scenario: 'Overnight OD — wide-complex ECG and hypotension',
        text: 'A 31-year-old is brought in after taking her entire bottle of amitriptyline. She is obtunded, BP 72/44, HR 136. ECG shows QRS of 148 ms and a prominent R wave in lead aVR. What is the most appropriate treatment for the QRS widening and hemodynamic instability?',
        choices: [
          'Magnesium sulfate 2 g IV',
          'Sodium bicarbonate 1–2 mEq/kg IV',
          'Synchronized cardioversion',
          'Calcium gluconate 1 g IV'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Sodium bicarbonate is the cornerstone — two mechanisms simultaneously; lidocaine is itself a sodium channel blocker</div>
TCA toxicity works by: (1) sodium channel blockade → QRS widening, (2) alpha-1 blockade → hypotension, (3) anticholinergic effects. <strong>Sodium bicarbonate</strong> works two ways: alkalinization (pH 7.50–7.55) reduces TCA binding to Na channels, AND the sodium load overcomes the blocked channels. A QRS ≥100 ms or R wave in aVR ≥3 mm mandates bicarb. Lidocaine is itself a Class IB sodium channel blocker — it can worsen QRS widening and conduction in TCA overdose. Magnesium addresses QT/torsades, not QRS widening.
<div class="exp-source">Liebelt EL, et al. Ann Emerg Med. 1995;26(2):195–201. Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 71.</div>`
      }
,
      {
        img: 'https://images.pexels.com/photos/3683041/pexels-photo-3683041.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '💊', imgLabel: 'Aspirin tablets — salicylate toxicity has a critical airway management trap',
        scenario: 'Intentional ingestion — altered mental status, visible hyperventilation',
        text: 'A 19-year-old took a large quantity of aspirin. She has tinnitus, is breathing at RR 38, and ABG shows pH 7.47, pCO₂ 18, HCO₃ 12. She is now becoming increasingly difficult to arouse. The team plans to intubate for airway protection. What is the most critical risk of this plan?',
        choices: [
          'Intubation is safe and appropriate in a deteriorating salicylate poisoning',
          'RSI should be avoided; use ketamine alone to preserve respiratory drive',
          'Intubation eliminates the compensatory hyperventilation; if ventilator settings fail to match her pre-intubation minute ventilation, the resulting CO₂ rise causes rapid cardiovascular collapse',
          'Intubation requires bicarbonate pretreatment to prevent post-intubation acidosis'
        ],
        correct: 2,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Salicylate poisoning + intubation = one of toxicology's most dangerous decisions</div>
Salicylate toxicity causes a mixed anion gap metabolic acidosis and compensatory respiratory alkalosis. The patient's hyperventilation is <em>life-saving</em> — it keeps blood pH up and keeps salicylate ionized in blood (less CNS penetration). Intubation removes that compensation. <strong>If the ventilator does not precisely match her pre-intubation minute ventilation</strong> (often 18–22 L/min — technically difficult), even a brief rise in pCO₂ causes rapid intracellular acidosis, CNS salicylate accumulation, and cardiovascular collapse. If intubation is unavoidable, pre-treat with bicarbonate, use the highest tolerable minute ventilation, and plan for hemodialysis. Hemodialysis is the definitive treatment for severe salicylate toxicity.
<div class="exp-source">Thurston JH, et al. J Clin Invest. 1970;49(1):2345–2352. Palatnick W, Tenenbein M. Ann Emerg Med. 1991;20(10):1088–1093.</div>`
      },
      {
        img: 'https://images.pexels.com/photos/7089392/pexels-photo-7089392.jpeg?auto=compress&cs=tinysrgb&w=800',
        imgFallback: '🩺', imgLabel: 'Endoscopy procedure — benzocaine topical spray can cause acquired methemoglobinemia',
        scenario: 'Endoscopy suite — sudden cyanosis unresponsive to 100% oxygen',
        text: 'Benzocaine topical spray is used for a patient\'s throat before upper endoscopy. She develops sudden cyanosis that does not respond to 100% O₂ by face mask. SpO₂ reads 84%. Co-oximetry shows methemoglobin of 34%. What is the correct treatment, and what key patient factor must be confirmed first?',
        choices: [
          'Sodium thiosulfate IV',
          'Methylene blue 1–2 mg/kg IV after checking G6PD status — in G6PD-deficient patients it causes hemolysis and is ineffective',
          'Methylene blue regardless of any patient factors',
          'Hyperbaric oxygen'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Methylene blue is the antidote — but it fails in G6PD deficiency and can cause hemolytic crisis</div>
Methemoglobin cannot carry oxygen — acquired methemoglobinemia from benzocaine (or dapsone, nitrites, certain antibiotics) is an emergency. <strong>Methylene blue 1–2 mg/kg IV</strong> is the antidote: it acts as an electron carrier to reduce methemoglobin back to hemoglobin. Critical exception: <em>G6PD-deficient patients</em> lack the NADPH required for methylene blue to work — it will instead cause hemolytic anemia without fixing the methemoglobin. In G6PD deficiency, use exchange transfusion or ascorbic acid (less effective). Note: pulse oximetry reads methemoglobin as ~85% regardless of severity — co-oximetry is diagnostic.
<div class="exp-source">Goldfrank's Toxicologic Emergencies, 11th ed., Ch. 127. Ash-Bernal R, et al. Ann Intern Med. 2004;141(4):273–282.</div>`
      }
    ]
  },

  // ══════════════════════════════════════════
  // QUIZ 2 — ENVENOMATIONS (MARINE + TERRESTRIAL)
  // Q1–2 intern · Q3 PGY2 · Q4–5 PGY3 · Q6–7 attending
  // ══════════════════════════════════════════
  {
    id: 'envenomations', title: 'Envenomations', icon: '🐍', color: '#0ea5e9',
    description: 'Marine and terrestrial bites and stings — field treatment and common mistakes',
    questions: [
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Chrysaora_quinquecirrha.jpg?width=640',
        imgFallback: '🪼', imgLabel: 'Atlantic sea nettle jellyfish — unfired nematocysts on detached tentacles',
        scenario: 'Beach sting — tentacles still adhered to arm',
        text: 'A swimmer is stung by a jellyfish with visible tentacles still adhered to her forearm. A lifeguard offers to pour fresh water from his bottle over the wound to rinse it off. What is the correct response?',
        choices: [
          'Accept',
          'Decline',
          'Accept, then immediately rinse with vinegar',
          'Pour urine over the wound'
        ],
        correct: 1,
        explanation: `<div style="font-weight:700;margin-bottom:.4rem">Fresh water (and urine) are hypotonic — they trigger unfired nematocysts to discharge</div>
Jellyfish tentacles contain thousands of nematocysts that fire when osmotically triggered. Hypotonic solutions — fresh water OR urine — cause mass discharge of remaining nematocysts, injecting additional venom. Correct field treatment: (1) Remove tentacles with a card or gloved hand — never bare skin. (2) Rinse with <strong>seawater</strong> or 5% acetic acid (vinegar). (3) Hot water immersion (~45°C) for pain. For box jellyfish specifically, vinegar before removal prevents further discharge.
<div class="exp-source">Auerbach's Wilderness Medicine, 7th ed., Ch. 72. Cegolon L, et al. PLoS Negl Trop Dis. 2013;7(4):e2190.</div>`
      },
      {
        img: 'https://commons.wikimedia.org/wiki/Special:FilePath/Western_Diamondback_Rattlesnake.jpg?width=640',

// ─── STATE ───────────────────────────────────
let state = { currentQuizIdx: null, currentQ: 0, answers: [], answered: false };
const scores = {};

function init() { renderHome(); }

function renderHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  const grid = document.getElementById('quizGrid');
  grid.innerHTML = QUIZZES.map((q, i) => {
    const done = scores[q.id];
    const pct  = done ? Math.round((done.score / done.total) * 100) : null;
    return `<div class="quiz-card" style="--accent-color:${q.color}" onclick="startQuiz(${i})">
      <div class="card-icon">${q.icon}</div>
      <h3>${q.title}</h3>
      <p>${q.description}</p>
      <div class="card-meta">
        <span class="badge">${q.questions.length} Questions</span>
        ${done ? `<span class="badge done">✓ ${pct}% (${done.score}/${done.total})</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function startQuiz(idx) {
  state.currentQuizIdx = idx;
  state.currentQ = 0;
  state.answers = [];
  state.answered = false;
  document.getElementById('home').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const quiz  = QUIZZES[state.currentQuizIdx];
  const q     = quiz.questions[state.currentQ];
  const total = quiz.questions.length;
  const idx   = state.currentQ;

  document.getElementById('progressBar').style.width = `${(idx / total) * 100}%`;
  document.getElementById('qCounter').textContent    = `${idx + 1} / ${total}`;

  document.getElementById('imgWrap').innerHTML = `
    <img src="${q.img}" alt="${q.imgLabel}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="img-fallback" style="display:none">
      <span class="fb-icon">${q.imgFallback}</span><span>${q.imgLabel}</span>
    </div>`;

  document.getElementById('qScenario').textContent = q.scenario;
  document.getElementById('qText').textContent     = q.text;

  const letters = ['A','B','C','D'];
  document.getElementById('choices').innerHTML = q.choices.map((c, i) =>
    `<button class="choice-btn" onclick="selectAnswer(${i})" id="choice${i}">
       <span class="opt-letter">${letters[i]}</span><span>${c}</span>
     </button>`).join('');

  const expEl = document.getElementById('explanation');
  expEl.style.display = 'none';
  expEl.innerHTML = '';
  const nextBtn = document.getElementById('btnNext');
  nextBtn.style.display = 'none';
  nextBtn.textContent = (idx === total - 1) ? 'See Results →' : 'Next Question →';
  state.answered = false;
}

function selectAnswer(chosen) {
  if (state.answered) return;
  state.answered = true;
  const quiz    = QUIZZES[state.currentQuizIdx];
  const q       = quiz.questions[state.currentQ];
  const correct = q.correct;
  const isRight = chosen === correct;
  state.answers.push({ chosen, correct, isRight });

  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === correct) btn.classList.add('correct');
    if (i === chosen && !isRight) btn.classList.add('wrong');
  });

  const expEl = document.getElementById('explanation');
  expEl.className = `explanation ${isRight ? 'correct-exp' : 'wrong-exp'}`;
  expEl.innerHTML = `<div style="font-weight:700;font-size:.9rem;margin-bottom:.4rem">${isRight ? '✓ Correct' : '✗ Incorrect'}</div>${q.explanation}`;
  expEl.style.display = 'block';
  document.getElementById('btnNext').style.display = 'block';
}

function nextQuestion() {
  const quiz = QUIZZES[state.currentQuizIdx];
  state.currentQ++;
  if (state.currentQ >= quiz.questions.length) showResults();
  else renderQuestion();
}

function showResults() {
  const quiz  = QUIZZES[state.currentQuizIdx];
  const score = state.answers.filter(a => a.isRight).length;
  const total = quiz.questions.length;
  const pct   = Math.round((score / total) * 100);
  scores[quiz.id] = { score, total };

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDen').textContent = `/ ${total}`;

  const color = pct >= 80 ? 'var(--correct)' : pct >= 60 ? 'var(--warn)' : 'var(--wrong)';
  const ring  = document.getElementById('scoreRing');
  ring.style.borderColor = color;
  ring.style.background  = `${color}18`;

  const [, label, sub] = [
    [90,'Excellent!','Outstanding — ready for the field.'],
    [75,'Well done!','Strong knowledge — review any missed items.'],
    [50,'Good effort','Review the explanations and retry.'],
    [0, 'Keep studying','Review the content and try again.']
  ].find(([min]) => pct >= min);
  document.getElementById('scoreLabel').textContent = `${pct}% — ${label}`;
  document.getElementById('scoreSub').textContent   = sub;

  const letters = ['A','B','C','D'];
  document.getElementById('reviewList').innerHTML = state.answers.map((a, i) => {
    const q = quiz.questions[i];
    return `<div class="review-item ${a.isRight ? 'r-correct' : 'r-wrong'}">
      <div class="r-q"><strong>Q${i+1}:</strong> ${q.text.substring(0,90)}${q.text.length>90?'…':''}</div>
      ${!a.isRight ? `<div class="r-ans wrong">Your answer: ${letters[a.chosen]}. ${q.choices[a.chosen]}</div>` : ''}
      <div class="r-ans correct">Correct: ${letters[a.correct]}. ${q.choices[a.correct]}</div>
    </div>`;
  }).join('');
}

function goHome() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  renderHome();
}
function retryQuiz() { startQuiz(state.currentQuizIdx); }

init();
</script>
</body>
